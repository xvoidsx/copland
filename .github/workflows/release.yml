name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build deb
        # NOTE: never set GH_TOKEN here — electron-builder will attempt
        # a GitHub publish and fail the build. softprops/action-gh-release
        # handles the release with its own GITHUB_TOKEN.
        run: npx electron-builder --linux deb

      - name: Verify deb
        run: |
          ls -la dist/*.deb
          dpkg-deb -f dist/*.deb Version
          dpkg-deb -c dist/*.deb | grep "opt/copland/$"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
